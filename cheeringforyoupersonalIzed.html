<!DOCTYPE html>
<html>

<head>
	<title>Cheering for You</title>

	<meta charset="utf-8" />

	<!-- for phones  -->
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />

	<style>
		.corner-image {
			width: 200px;
			height: 200px;
		}


		#topright-corner {
			position: absolute;
			top: 0;
			right: 0;
			/*     
			background-clip: padding-box;*/
			/*			background-image: url('images/kimono mw 1-5.png');*/
			/*transform: rotate(270deg);*/
			/*			transform: translate(0px, -w53px) rotate(270deg);*/
		}

		#topright-corner-text {
			position: absolute;
			top: 0;
			right: 30px;
		}



		#topleft-corner {
			position: absolute;
			top: 0;
			left: 0;
			transform: rotate(270deg);
		}

		#topleft-corner-text {
			position: absolute;
			top: -10px;
			left: 20px;
		}


		#botleft-corner {
			position: absolute;
			bottom: 0;
			left: 0;
			transform: rotate(180deg);
		}

		#botleft-corner-text {
			position: absolute;
			bottom: 0;
			left: 0;
		}



		#botright-corner {
			position: absolute;
			bottom: 0;
			right: 0;
			transform: rotate(90deg);
		}

		#botright-corner-text {
			position: absolute;
			bottom: 0;
			right: 0;
		}





		.corner-text {
			font-size: 100px;
			color: #c3ab4e;
			user-select: none;
			/*font-family: cursive;*/
		}

		.corner-text:hover {
			color: #c768ea;
		}


		#center-textbox {
			font-weight: 800;
			font-size: 100px;
			user-select: none;
			font-family: cursive;
			text-align: center;
		}

		.center {
			display: grid;
			place-items: center;
		}

		html,
		body {
			height: 100%;
			/* approx fill scr vert for centering mobile */
			overflow: hidden;
		}


		/* phone-only styles */
		@media (width <=500px) {
			#center-textbox {
				font-size: 50px;
				margin-right: 5px;
				margin-left: 5px;
				word-break: normal;
				white-space: normal;

			}

			/*
			p {
				word-break: normal;
				white-space: normal;
			}
*/
		}

		/* desktop-only styles */
		@media (width > 500px) {
			#center-textbox {
				margin-right: 30px;
				margin-left: 30px;
				font-size: 100px;
			}
		}

	</style>

	<script>
		function cheerGenerator() {


			let messages = [
				"You can do it!",

				"You got this!",

				"Go You!",

				"Rooting 4 u!",

				"Gooooo YOU!",

				"Believe in the me that believes in you.",

				"Step by Step.",

				"Brick by Brick.",

				"Just keep swimming.",

				"Courage, [your name here]. Courage.",

				"Fight ON!",

				"頑張って！ Ganbatte! With determination, stick to it!",

				"加油！Jiā Yóu! Add fuel!",

				"Hang in there!",

				"Take heart.",

				"No matter how hopeless it seems, there is always *something* you can do.",

				"Just keep moving forward.",

				"When a door shuts, a window opens.",

				"You who are reading these words, will definitely survive.",

				"Bit by Bit!",

				"Focus on what you *can* do.",

				"If a wall appears, you don't have to push thru. You can walk around to the other side.",

				"No matter what happens I'll keep on moving. Until this life runs out of me I'll keep on walking.",

				"Every moment is a new choice, a new opportunity born on a new day.",

				"Everything is going to be okay."

			]

			// generate random index from 0 to #ofpossmessages-1.
			// value of random number determines message.
			let randomindex = Math.floor(Math.random() * (messages.length));

			return messages[randomindex];

		}

		//-------below called by ui stuff---------

		function UIcheer() {
			document.getElementById("center-textbox").innerText = cheerGenerator();
		}

		function UIplus() {
			alert("foo");
		}


		addEventListener("DOMContentLoaded", (event) => {

			UIcheer();

		});

	</script>
</head>

<body class="center">

	<img id="topright-corner" class="corner-image" src="images/kimono corner.png">
	<!--	<div id="topright-corner">-->
	<div id="topright-corner-text" class="corner-text">+</div>
	<!--	</div>-->

	<img id="topleft-corner" class="corner-image" src="images/kimono corner.png">
	<div id="topleft-corner-text" class="corner-text"></div>


	<div class="cheerdiv center" onclick="UIcheer()">
		<p id="center-textbox"></p>
	</div>

	<img id="botleft-corner" class="corner-image" src="images/kimono corner.png">
	<div id="botleft-corner-text" class="corner-text">Aa</div>

	<img id="botright-corner" class="corner-image" src="images/kimono corner.png">
	<div id="botright-corner-text" class="corner-text">ଳ</div>



</body>

</html>
